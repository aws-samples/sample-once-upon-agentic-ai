[project]
name = "once-upon-agentic-ai"
version = "1.0.0"
description = "A comprehensive workshop for mastering AI agent development with Strands framework"
requires-python = ">=3.10"
dependencies = [
    # Strands Harness SDK — floor pinned to the release the workshop instructions were
    # last checked against (Oct 2026 docs). Chapters 5 and 7 pass make_a2a_client a list of
    # endpoints, the form introduced in 1.57.2.
    "strands-agents[a2a]>=1.61",
    # Strands harness — the pre-assembled agent used in chapter 7 (create_harness).
    "strands-harness>=0.3",

    # Web Framework for APIs
    "fastapi[standard]",
    "pydantic",
    "uvicorn",

    # Knowledge Base & Document Processing
    "chromadb",
    "pypdf",

    # Database
    "tinydb",

    # Configuration — chapter 8 reads the URLs of the deployed runtimes from a .env file
    "python-dotenv",

    # Model Context Protocol — imported directly by the chapter 4 server, so declared here rather
    # than inherited from strands-agents. Ceiling pinned because mcp 2.0 renamed the server class
    # the chapter teaches (mcp.server.FastMCP -> MCPServer) and moved port= from the constructor
    # to run(transport="streamable-http", port=...). The clients use MCPClient(url=...) and import
    # nothing from mcp. Do not raise this ceiling until chapter 4 and the workshop catalog are
    # ported together — see issue #50.
    "mcp<2",

    # IAM-signed MCP transport: a local or deployed agent calling an MCP server on AgentCore Runtime
    # (chapter 8).
    "mcp-proxy-for-aws",

    # AWS SDK — imported directly by chapter 8 (ui_proxy calls invoke_agent_runtime), so declared
    # here rather than inherited from strands-agents, whose floor (1.26) predates AgentCore.
    # 1.40 is the first release with the bedrock-agentcore stop_runtime_session operation.
    "boto3>=1.40",
]

[tool.uv]
# chromadb pulls onnxruntime transitively for the Chapter 5 knowledge base. onnxruntime stopped
# shipping Intel-Mac wheels after 1.23.2 and has no source distribution, so on x86_64 macOS uv's
# universal resolver otherwise picks a newer, wheel-less version and `uv sync` hard-fails (issue
# #49). Requiring the Intel-Mac environment forces uv to backtrack to an onnxruntime release that
# does ship an x86_64 macOS wheel. Apple Silicon and Linux are unaffected.
# The requirement is limited to Python < 3.14: onnxruntime 1.23.2, the last Intel-Mac release, only
# ships x86_64 macOS wheels for cp310-cp313, so requiring Intel Mac on 3.14+ makes the whole
# resolution unsatisfiable. Intel-Mac users need Python 3.13 or older (the .python-version pin).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.14'",
]
