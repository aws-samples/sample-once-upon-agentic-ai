[project]
name = "once-upon-agentic-ai"
version = "1.0.0"
description = "A comprehensive workshop for mastering AI agent development with Strands framework"
requires-python = ">=3.10"
dependencies = [
    # Strands Harness SDK — floor pinned to the release the workshop instructions were
    # last checked against (Oct 2026 docs). Chapters 5 and 7 pass make_a2a_client a list of
    # endpoints, the form introduced in 1.57.2.
    "strands-agents[a2a]>=1.61",
    # Strands harness — the pre-assembled agent used in chapter 7 (create_harness).
    "strands-harness>=0.3",

    # Web Framework for APIs
    "fastapi[standard]",
    "pydantic",
    "uvicorn",

    # Knowledge Base & Document Processing
    "chromadb",
    "pypdf",

    # Database
    "tinydb",

    # Configuration — chapter 8 reads the URLs of the deployed runtimes from a .env file
    "python-dotenv",

    # Model Context Protocol — imported directly by chapters 4 and 5, so declared here rather
    # than inherited from strands-agents. Ceiling pinned because mcp 2.0 renamed both symbols the
    # chapters teach: mcp.server.FastMCP -> MCPServer, and streamablehttp_client ->
    # streamable_http_client. Chapter 4 also passes port= to the server constructor, which 2.x
    # moved to run(transport="streamable-http", port=...). Do not raise this ceiling until those
    # chapters and the workshop catalog are ported together — see issue #50.
    "mcp<2",

    # IAM-signed MCP transport: a local or deployed agent calling an MCP server on AgentCore Runtime
    # (chapters 8 to 11).
    "mcp-proxy-for-aws",

    # AWS SDK — imported directly by chapter 8 (ui_proxy calls invoke_agent_runtime), so declared
    # here rather than inherited from strands-agents, whose floor (1.26) predates AgentCore.
    # 1.40 is the first release with the bedrock-agentcore stop_runtime_session operation.
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
