[project]
name = "once-upon-agentic-ai"
version = "1.0.0"
description = "A comprehensive workshop for mastering AI agent development with Strands framework"
requires-python = ">=3.10"
dependencies = [
    # Strands AI Framework — floor pinned because chapter 5 relies on the
    # A2AServer(agent_factory=...) API introduced in 1.44.
    "strands-agents[a2a]>=1.44",
    "strands-agents-tools",

    # Web Framework for APIs
    "fastapi[standard]",
    "pydantic",
    "uvicorn",

    # Configuration Management
    "python-dotenv",

    # Knowledge Base & Document Processing
    "chromadb",
    "PyPDF2",

    # Database
    "tinydb",

    # LangChain Integration
    "langchain_aws",
    "langchain_chroma",

    # Ollama Integration
    "ollama",

    # Model Context Protocol — imported directly by chapters 4 and 5, so declared here rather
    # than inherited from strands-agents. Ceiling matches strands-agents' own mcp<2.2: chapters 4
    # and 5 are written against the 2.x API (MCPServer, streamable_http_client, port passed to
    # run()), validated against mcp 2.1.1. Raise the ceiling only after re-running both chapters
    # against the newer release — see issue #52.
    "mcp<2.2",
]
